[package]
name = "pahub"
version = "0.2.0"
description = "pahub desktop shell"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "pahub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
# Plain (non-verbatim) Windows paths for the Node sidecar (see `service::release_target`).
dunce = "1"
# Default `v1` feature: Windows Credential Manager, macOS Keychain, and on Linux
# the Secret Service over D-Bus via pure-Rust zbus (no libsecret/libdbus needed).
keyring = "4.2"
tokio = { version = "1", features = ["net", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tauri-plugin-opener = "2.7.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
