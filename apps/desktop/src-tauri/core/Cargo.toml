[package]
name = "threadgarden-core"
# The app's version: `hello` reports it as the service version (a test checks they agree).
version = "0.9.0"
description = "The phone's stand-in for the local Threadgarden service"
edition = "2024"
rust-version = "1.90"
publish = false

# Standalone until the Android service wires it into the app's workspace.
[workspace]

[dependencies]
# Pure Rust only: the crate cross-compiles to Android with nothing but the NDK linker.
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.3", features = ["std"] }
subtle = "2"
# `\p{L}` and `\p{N}` exactly as the protocol's code font sanitiser has them.
regex = { version = "1", default-features = false, features = ["std", "unicode-gencat"] }

[dev-dependencies]
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
tempfile = "3"
